name: Orbita — Windows installer

on:
  push:
    paths:
      - 'orbita/**'
      - '.github/workflows/orbita-windows.yml'
    tags:
      - 'orbita-v*'
  workflow_dispatch:

permissions:
  contents: write # needed only to attach the installer to a release on orbita-v* tags

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: orbita
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orbita/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Build installer
        run: npm run dist:win

      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          $installer = Get-Item dist\Orbita-Setup-*.exe
          $p = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with $($p.ExitCode)" }

          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Orbita.exe | Select-Object -First 1
          if (-not $exe) { throw 'Orbita.exe was not installed' }
          Write-Host "Installed: $($exe.FullName)"

          $shortcut = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter *.lnk | Where-Object Name -like 'Орбита*'
          if (-not $shortcut) { throw 'Start menu shortcut is missing' }

          # the installer may have started Orbita already; the single-instance lock would make a second copy exit
          Get-Process Orbita -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Orbita exited right after start with code $($app.ExitCode)" }
          Write-Host 'Orbita is running'
          Get-Process Orbita | Stop-Process -Force
          Start-Sleep -Seconds 2

          $uninstaller = Get-ChildItem $exe.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          $u = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path $exe.FullName) { throw 'Uninstall left Orbita.exe behind' }
          Write-Host 'Uninstalled cleanly'

      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Setup-windows-x64
          path: orbita/dist/Orbita-Setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/orbita-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem dist\Orbita-Setup-*.exe | ForEach-Object FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Орбита $tag" --notes 'Установщик для Windows (x64).' }
          gh release upload $tag $files --clobber
